name = "buggy-guard"
description = "Safety and vehicle controller for 12-60 V electric scooters, buggies and ride-on cars: ESP32-S3 gates the ESC through throttle clamp, isolated brake contact and ignition cut, with a hardware watchdog and latched impact kill, plus CAN, ESC UART and three low-side light outputs"
fab = "jlcpcb"
[outline]
size = [120.0, 80.0]
corner_radius = "2"
[stackup]
preset = "JLC04161H-7628"
finish = "ENIG"
mask_color = "black"
silk_color = "white"
[[vias]]
name = "std"
drill = "0.3mm"
diameter = "0.6mm"
[[netclasses]]
name = "Default"
track_width = "0.2mm"
clearance = "0.2mm"
via = "std"
description = "Fallback only"
layers = ["F.Cu", "In2.Cu", "B.Cu"]
[[netclasses]]
name = "Signal"
track_width = "0.2mm"
clearance = "0.15mm"
via = "std"
description = "Logic: GPIO, I2C, watchdog, safety logic, sensor ports"
neckdown = "1mm"
layers = ["F.Cu", "In2.Cu", "B.Cu"]
[[netclasses]]
name = "Ground"
track_width = "0.25mm"
clearance = "0.2mm"
via = "std"
description = "GND, carried by the In1 plane"
neckdown = "1mm"
layers = ["F.Cu", "B.Cu"]
[[netclasses]]
name = "Power"
track_width = "0.5mm"
clearance = "0.2mm"
current = "1A"
max_temp_rise = "10C"
via = "std"
description = "5V and 3V3 rails, sensor and pedal supplies"
layers = ["F.Cu", "B.Cu"]
neckdown = "1mm"
[[netclasses]]
name = "Analog"
description = "Throttle in and out, ADC sense dividers, buck feedback and ripple injection"
track_width = "0.2mm"
clearance = "0.25mm"
via = "std"
neckdown = "1mm"
layers = ["F.Cu", "In2.Cu", "B.Cu"]
[[netclasses]]
name = "USB"
description = "USB full speed D+/D-"
