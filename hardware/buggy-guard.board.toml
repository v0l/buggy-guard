clearance = "0.15mm"
via = "std"
layers = ["F.Cu", "In2.Cu", "B.Cu"]
neckdown = "1mm"
[[netclasses]]
name = "HV"
description = "Battery side, up to 67 V: battery input, ignition, e-stop loop, buck input, light outputs"
