name = "buggy-guard-safety"
kind = "logic"
schematic = "buggy-guard"
description = "Safety logic truth table: SAFE needs ARM and a latched WDOK, KILL drops only when SAFE and BRK_REL are both high, and a watchdog or impact fault stays latched until the firmware re-arms with a fresh ARM edge."
duration = "4us"
ignore = ["J1","J2","J3","J4","J5","J6","J7","J8","J9","J12","J13","J14","J15","U1","U2","U3","U4","U5","U6","U9","Q1","Q2","Q3","Q5","Q6","Q7","Q8","U11","U12","U13","U14","U15","J16","J17","J18","D10","D11","D12","D13","JP1","JP2","BZ1","D1","D2","D3","D4","D5","D6","D7","D8","D9","F1","F2","F3","L1","SW1","SW2","TP1","TP2","TP3","TP4","TP5","TP6","TP7","TP8","TP9","TP10","TP11","TP12","TP13","TP14","TP15","TP16","TP17","TP19","H1","H2","H3","H4","R1","R2","R3","R4","R5","R6","R7","R8","R9","R10","R11","R12","R13","R14","R15","R16","R17","R18","R19","R20","R21","R22","R23","R24","R26","R27","R28","R29","R30","R31","R32","R33","R34","R35","R36","R37","R38","R39","R40","R41","R42","R43","R44","R45","R46","R53","R54","R55","R56","R57","R58","R59","R25","R47","R48","R49","R50","R51","R52","R60","R61","R62"]
record = ["ARM", "WDOK", "WD_LATCH", "BRK_REL", "SAFE", "KILL"]
on_violation = "keep"

# The rails are plain nets in the schematic, and the sim joins nets through resistors, so the
# FB divider would short +5V to GND. Every resistor is ignored and the rails are driven here.
[[stimulus]]
net = "GND"
constant = 0

[[stimulus]]
net = "+3V3"
constant = 1

[[stimulus]]
net = "+5V"
constant = 1

# ARM and BRK_REL stand in for the ESP32 outputs; WDOK for TPS3430 WDO and LSM6DS3 INT1.
[[stimulus]]
net = "ARM"
steps = [["0ns", 0], ["200ns", 1], ["2200ns", 0], ["2400ns", 1], ["3000ns", 0], ["3400ns", 1]]

[[stimulus]]
net = "BRK_REL"
steps = [["0ns", 0], ["400ns", 1]]

[[stimulus]]
net = "WDOK"
steps = [["0ns", 1], ["1000ns", 0], ["1500ns", 1], ["3200ns", 0], ["3600ns", 1]]

# Disarmed at power up.
[[expect]]
net = "KILL"
at = "100ns"
value = 1

# Armed, brake still held.
[[expect]]
net = "SAFE"
at = "300ns"
value = 1

[[expect]]
net = "KILL"
at = "300ns"
value = 1

# Armed and brake released: the only state that passes throttle.
[[expect]]
net = "KILL"
at = "500ns"
value = 0

# Watchdog or impact fault.
[[expect]]
net = "SAFE"
at = "1100ns"
value = 0

[[expect]]
net = "KILL"
at = "1100ns"
value = 1

# WDO releases after tRST while a hung MCU still holds ARM high: the latch keeps it killed.
[[expect]]
net = "SAFE"
at = "1600ns"
value = 0

[[expect]]
net = "KILL"
at = "2100ns"
value = 1

# Firmware re-arms with a fresh ARM edge.
[[expect]]
net = "SAFE"
at = "2500ns"
value = 1

[[expect]]
net = "KILL"
at = "2500ns"
value = 0

# Disarm.
[[expect]]
net = "KILL"
at = "3100ns"
value = 1

# An ARM edge during a fault does not re-arm, nor does the fault clearing afterwards.
[[expect]]
net = "SAFE"
at = "3500ns"
value = 0

[[expect]]
net = "SAFE"
at = "3900ns"
value = 0

[[expect]]
net = "KILL"
at = "3900ns"
value = 1
